name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history of the single checked-out ref: the scoped-writes
          # topology test reads phased commits from HEAD history and needs
          # no branch refs, but it does need the history itself.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Run test suite
        run: python -m pytest -q
      - name: Run force-pass gate
        run: python scripts/force_pass.py
