name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history of the single checked-out ref: the scoped-writes
          # topology test reads phased commits from HEAD history and needs
          # no branch refs, but it does need the history itself.
          fetch-depth: 0
          # On pull_request events the checkout default is the merge ref
          # (refs/pull/N/merge). Pin to the PR head SHA so CI tests exactly
          # the pushed commits; on push events fall back to github.sha.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
          # GP-03 (G7 hygiene): pin the exact ruff the repo config targets
          # (pyproject [tool.ruff]; version recorded in docs/decisions.md).
          # A floating ruff would let new upstream rules redraw the gate.
          python -m pip install ruff==0.17.3
      - name: Check lint and format (GP-03 code hygiene)
        run: |
          ruff check .
          ruff format --check .
      - name: Run test suite
        run: python -m pytest -q
      - name: Run force-pass gate
        run: python scripts/force_pass.py
